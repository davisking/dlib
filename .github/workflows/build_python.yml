name: Python

on:
  push:
    branches:
    - master
    paths:
    - ".github/workflows/build_python.yml"
    - "**.cpp"
    - "**.h"
    - "**.c"
    - "**.cu"
    - "**.cmake"
    - "**CMakeLists.txt"
    - "**py"
  pull_request:
    branches:
    - master
    paths:
    - ".github/workflows/build_python.yml"
    - "**.cpp"
    - "**.h"
    - "**.c"
    - "**.cu"
    - "**.cmake"
    - "**CMakeLists.txt"
    - "**py"

defaults:
  run:
    shell: bash

jobs:
  Windows:
    strategy:
      matrix:
        os:
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install python deps
      run: |
        pip install pytest numpy setuptools packaging
        pip3 install cmake
    # MSVC 14.52 in the November 2026 ARM image crashes while building the bindings.
    # https://github.com/actions/runner-images/issues/15328
    # Keep this workaround local to ARM CI until the runner toolchain is fixed.
    - name: Select ARM64 compiler toolset
      if: matrix.os == 'windows-11-arm'
      run: |
        echo 'CMAKE_GENERATOR=Visual Studio 18 2026' >> "$GITHUB_ENV"
        echo 'CMAKE_GENERATOR_TOOLSET=v143,version=14.44' >> "$GITHUB_ENV"
    - name: Build
      run: |
        pip3 install cmake
        pip3 install --verbose .
    - name: Test
      run: python -m pytest tools/python/test

  Ubuntu:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
    - name: Install python deps
      run: pip install pytest numpy setuptools packaging
    - name: Build
      run: |
        pip install .
    - name: Test
      run: python -m pytest tools/python/test

  Ubuntu-Free-Threaded:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13t'
    - name: Install python deps
      run: pip install pytest numpy setuptools packaging
    - name: Build
      run: pip install .
    - name: Verify free-threading
      run: python -c "import sys; assert not sys._is_gil_enabled()"
    - name: Test
      run: python -m pytest tools/python/test

  Ubuntu-Python-3-8:
    # Python 3.8 builds are unavailable for Ubuntu 26.04.
    runs-on: 'ubuntu-24.04'
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.8'
    - name: Install python deps
      run: pip install pytest numpy setuptools packaging
    - name: Build
      run: pip install .
    - name: Test
      run: python -m pytest tools/python/test

